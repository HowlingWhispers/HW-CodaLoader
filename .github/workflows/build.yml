name: Build CodaLoader

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test runnable JAR
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./scripts/build-dist.sh

      - name: Exercise BuildCraft Lite chest transport and Coda diagnostics
        shell: bash
        run: |
          test -f dist/buildcraft-lite-0.1.0-dev.jar
          mkdir -p out/buildcraft-lite-tests
          javac --release 21 -cp dist/CodaLoader.jar:dist/buildcraft-lite-0.1.0-dev.jar \
            -d out/buildcraft-lite-tests \
            tests/src/dev/howlingwhispers/buildcraftlite/BuildCraftLiteTransportTest.java
          java -cp out/buildcraft-lite-tests:dist/buildcraft-lite-0.1.0-dev.jar:dist/CodaLoader.jar \
            dev.howlingwhispers.buildcraftlite.BuildCraftLiteTransportTest
          mkdir -p out/buildcraft-lite-run/mods
          cp dist/buildcraft-lite-0.1.0-dev.jar out/buildcraft-lite-run/mods/
          java -jar dist/CodaLoader.jar --loader-only out/buildcraft-lite-run \
            | grep -F 'Powered Redstone Engine extraction and wooden/stone chest transport enabled'

      - name: Test verified launch identity
        run: |
          javac -cp dist/CodaLoader.jar -d out/identity-tests tests/identity/LaunchIdentityTest.java
          java -cp dist/CodaLoader.jar:out/identity-tests LaunchIdentityTest
      - name: Test HW Essentials and command bridge
        run: bash scripts/test-essentials.sh

      - name: Set up Minecraft Java 25 runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify menu lifecycle hooks on Java 25
        env:
          MENU_FIXTURE_RELEASE: "25"
        run: bash scripts/test-essentials.sh

      - name: Verify launcher version bridge
        shell: bash
        run: |
          version="$(java -jar dist/CodaLoader.jar --version)"
          expected="$(sed -n 's/.*LOADER_VERSION = "\([^"]*\)";.*/\1/p' src/main/java/dev/howlingwhispers/codaloader/core/CodaTarget.java)"
          test "$version" = "$expected"
          java -jar dist/CodaLoader.jar --version-json | grep -F '"minecraft":"26.4-snapshot-3"'
          java -jar dist/CodaLoader.jar --version-json | grep -F '"displayName":"H.O.W.L."'

      - name: Build and load the HOWL SDK starter
        shell: bash
        run: |
          version="$(java -jar dist/CodaLoader.jar --version)"
          unzip -q "dist/HOWL-SDK-v${version}.zip" -d out/sdk-check
          bash out/sdk-check/build-mod.sh
          mkdir -p out/sdk-run/mods
          cp out/sdk-check/out/hello-coda.jar out/sdk-run/mods/
          java -jar dist/CodaLoader.jar --loader-only out/sdk-run | grep -F 'Pawprint confirmed'

      - name: Smoke-test loader without launching Minecraft
        shell: bash
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda.jar run/mods/

          output="$(java -jar dist/CodaLoader.jar --loader-only run)"
          printf '%s\n' "$output"

          grep -F "[HelloCoda] Pawprint confirmed. CodaLoader can load me." <<< "$output"
          grep -F "[CodaLoader] Ready. 3 mod(s) initialized." <<< "$output"
          grep -F "[CodaLoader] Loading coda_wolf 0.1.2-dev" <<< "$output"
          grep -F "[CodaLoader] Loading hw_essentials 0.2.0" <<< "$output"
          test -f run/mods/coda-wolf-0.1.0-dev.jar
          test -f run/mods/hw-essentials.jar

      - name: Smoke-test Java agent and in-JVM mod loading
        shell: bash
        run: |
          rm -rf agent-run
          mkdir -p agent-run/mods
          cp dist/hello-coda.jar agent-run/mods/

          output="$(java -javaagent:dist/CodaLoader.jar=agent-run -version 2>&1)"
          printf '%s\n' "$output"

          grep -F "[CodaLoader] Agent attached inside Minecraft JVM." <<< "$output"
          grep -F "[HelloCoda] Running inside Minecraft JVM." <<< "$output"

      - name: Verify ZIP layout and update manifest
        shell: bash
        run: |
          version="$(java -jar dist/CodaLoader.jar --version)"
          bundle="dist/CodaLoader-v${version}-win64.zip"
          unzip -l "$bundle"
          unzip -l "$bundle" | grep -F "CodaLoader.jar"
          unzip -l "$bundle" | grep -F "Launch-CodaLoader.bat"
          if unzip -Z1 "$bundle" | grep -E '(^|/)run/mods/'; then
            echo "ERROR: distribution must not create loader/run/mods" >&2
            exit 1
          fi
          unzip -p "$bundle" CodaLoader.jar > out/packaged-loader.jar
          jar tf out/packaged-loader.jar | grep -F "codaloader/mods/hw-essentials.jar"
          grep -F "\"version\": \"${version}\"" dist/update-manifest.json
          jar tf dist/CodaLoader.jar | grep -F "codaloader/mods/hw-essentials.jar"
          jar tf dist/hw-essentials.jar | grep -F "coda.mod.json"
          jar tf dist/CodaLoader.jar | grep -F "codaloader/ui/discord.png"
          jar tf dist/CodaLoader.jar | grep -F "codaloader/ui/youtube.png"

      - name: Mark development bundle as non-releasable
        shell: bash
        run: |
          set -euo pipefail
          version="$(java -jar dist/CodaLoader.jar --version)"
          printf '{"channel":"development","version":"%s","commit":"%s","autoInstall":false,"requiresVerifiedAccount":true}\n' \
            "$version" "$GITHUB_SHA" > dist/build-channel.json
          echo "This bundle is a CI development artifact, NOT a CodaLauncher auto-update."
          cat dist/build-channel.json

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: CodaLoader-development-${{ github.sha }}
          path: |
            dist/build-channel.json
            dist/CodaLoader-v*-win64.zip
            dist/update-manifest.json
            dist/CodaLoader.jar
            dist/hello-coda.jar
            dist/buildcraft-lite-0.1.0-dev.jar
            dist/hw-essentials.jar
            dist/Launch-CodaLoader.bat
            dist/HOWL-SDK-v*.zip
            dist/howl-api-*.jar
          if-no-files-found: error
          retention-days: 30

  windows-launcher:
    name: Build Windows distribution
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Windows distribution
        shell: pwsh
        run: ./scripts/build-dist.ps1

      - name: Verify packaged files
        shell: pwsh
        run: |
          if (!(Test-Path dist/CodaLoader.jar)) { throw "CodaLoader.jar missing" }
          if (!(Test-Path dist/buildcraft-lite-0.1.0-dev.jar)) { throw "BuildCraft Lite mod missing" }
          if (!(Test-Path dist/Launch-CodaLoader.bat)) { throw "BAT missing" }
          $version = (Get-Content -Raw dist/update-manifest.json | ConvertFrom-Json).version
          if (!(Test-Path "dist/CodaLoader-v$version-win64.zip")) { throw "ZIP missing" }
          if (!(Test-Path dist/update-manifest.json)) { throw "Update manifest missing" }

