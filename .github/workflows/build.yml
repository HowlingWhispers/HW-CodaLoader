name: Build CodaLoader

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test runnable JAR
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./scripts/build-dist.sh

      - name: Test HW Essentials and command bridge
        run: bash scripts/test-essentials.sh

      - name: Verify launcher version bridge
        shell: bash
        run: |
          version="$(java -jar dist/CodaLoader.jar --version)"
          test "$version" = "0.0.19"
          java -jar dist/CodaLoader.jar --version-json | grep -F '"minecraft":"26.4-snapshot-3"'

      - name: Smoke-test loader without launching Minecraft
        shell: bash
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda.jar run/mods/

          output="$(java -jar dist/CodaLoader.jar --loader-only run)"
          printf '%s\n' "$output"

          grep -F "[HelloCoda] Pawprint confirmed. CodaLoader can load me." <<< "$output"
          grep -F "[CodaLoader] Ready. 2 mod(s) initialized." <<< "$output"

      - name: Smoke-test Java agent and in-JVM mod loading
        shell: bash
        run: |
          rm -rf agent-run
          mkdir -p agent-run/mods
          cp dist/hello-coda.jar agent-run/mods/

          output="$(java -javaagent:dist/CodaLoader.jar=agent-run -version 2>&1)"
          printf '%s\n' "$output"

          grep -F "[CodaLoader] Agent attached inside Minecraft JVM." <<< "$output"
          grep -F "[HelloCoda] Running inside Minecraft JVM." <<< "$output"

      - name: Verify ZIP layout and update manifest
        shell: bash
        run: |
          unzip -l dist/CodaLoader-v0.0.19-win64.zip
          unzip -l dist/CodaLoader-v0.0.19-win64.zip | grep -F "CodaLoader.jar"
          unzip -l dist/CodaLoader-v0.0.19-win64.zip | grep -F "Launch-CodaLoader.bat"
          unzip -l dist/CodaLoader-v0.0.19-win64.zip | grep -F "run/mods/hello-coda.jar"
          grep -F '"version": "0.0.19"' dist/update-manifest.json
          jar tf dist/CodaLoader.jar | grep -F "codaloader/mods/hw-essentials.jar"
          jar tf dist/hw-essentials.jar | grep -F "coda.mod.json"
          jar tf dist/CodaLoader.jar | grep -F "codaloader/ui/discord.png"
          jar tf dist/CodaLoader.jar | grep -F "codaloader/ui/youtube.png"

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: CodaLoader-${{ github.sha }}
          path: |
            dist/CodaLoader-v0.0.19-win64.zip
            dist/update-manifest.json
            dist/CodaLoader.jar
            dist/hello-coda.jar
            dist/hw-essentials.jar
            dist/Launch-CodaLoader.bat
          if-no-files-found: error
          retention-days: 30

  windows-launcher:
    name: Build Windows distribution
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Windows distribution
        shell: pwsh
        run: ./scripts/build-dist.ps1

      - name: Verify packaged files
        shell: pwsh
        run: |
          if (!(Test-Path dist/CodaLoader.jar)) { throw "CodaLoader.jar missing" }
          if (!(Test-Path dist/Launch-CodaLoader.bat)) { throw "BAT missing" }
          if (!(Test-Path dist/CodaLoader-v0.0.19-win64.zip)) { throw "ZIP missing" }
          if (!(Test-Path dist/update-manifest.json)) { throw "Update manifest missing" }
