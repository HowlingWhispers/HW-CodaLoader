name: Build CodaLoader

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test runnable JAR
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution JARs
        run: ./scripts/build-dist.sh

      - name: Smoke-test CodaLoader
        shell: bash
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda-0.0.1.jar run/mods/

          output="$(java -jar dist/CodaLoader-0.0.1-foundation.jar run)"
          printf '%s\n' "$output"

          grep -F "[HelloCoda] Pawprint confirmed. CodaLoader can load me." <<< "$output"
          grep -F "[CodaLoader] Ready. 1 mod(s) initialized." <<< "$output"

      - name: Upload runnable JARs
        uses: actions/upload-artifact@v4
        with:
          name: CodaLoader-${{ github.sha }}
          path: |
            dist/CodaLoader-0.0.1-foundation.jar
            dist/hello-coda-0.0.1.jar
            dist/Launch-CodaLoader.bat
          if-no-files-found: error
          retention-days: 30
