name: Publish foundation release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.0.1 foundation
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution JARs
        run: ./scripts/build-dist.sh

      - name: Smoke-test packaged loader
        shell: bash
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda-0.0.1.jar run/mods/

          output="$(java -jar dist/CodaLoader-0.0.1-foundation.jar run)"
          printf '%s\n' "$output"

          grep -F "[HelloCoda] Pawprint confirmed. CodaLoader can load me." <<< "$output"
          grep -F "[CodaLoader] Ready. 1 mod(s) initialized." <<< "$output"

      - name: Publish foundation prerelease once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.0.1-foundation"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists. Refreshing downloadable launcher asset."
            gh release upload "$TAG" dist/Launch-CodaLoader.bat --clobber
            exit 0
          fi

          cat > release-notes.md <<'EOF'
          # CodaLoader v0.0.1 Foundation

          First downloadable CodaLoader foundation build.

          Included:
          - executable CodaLoader JAR
          - Coda mod discovery from a mods directory
          - coda.mod.json metadata
          - dependency validation and ordering
          - isolated mod classloaders
          - Hello Coda proof mod
          - double-clickable Windows launcher BAT

          Target: Minecraft Java 26.4 Snapshot 3.

          Important: this foundation release does not launch Minecraft yet. It proves the standalone loader and mod format before the Minecraft bootstrap layer is added.
          EOF

          gh release create "$TAG"             dist/CodaLoader-0.0.1-foundation.jar             dist/hello-coda-0.0.1.jar             dist/Launch-CodaLoader.bat             --target "$GITHUB_SHA"             --title "CodaLoader v0.0.1 Foundation"             --notes-file release-notes.md             --prerelease
