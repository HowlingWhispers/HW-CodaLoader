# Tags are markers only. Production publishing is explicitly gated in
# publish-bootstrap.yml to prevent incomplete authentication builds
# from automatically reaching CodaLauncher.
name: Validate CodaLoader version tags

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag without publishing
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -n 's/.*LOADER_VERSION = "\([^"]*\)";.*/\1/p' src/main/java/dev/howlingwhispers/codaloader/core/CodaTarget.java)"
          test "$GITHUB_REF_NAME" = "v${source_version}" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match CodaTarget.LOADER_VERSION ${source_version}"
            exit 1
          }
          echo "Tag validated. No release was published."
          echo "Use the gated Publish CodaLoader bundle workflow after live authentication and launcher checks."
