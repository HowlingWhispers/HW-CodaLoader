name: Publish CodaLoader release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish tagged release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution JARs
        run: ./scripts/build-dist.sh

      - name: Smoke-test packaged loader
        shell: bash
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda-0.0.1.jar run/mods/

          output="$(java -jar dist/CodaLoader-0.0.1-foundation.jar run)"
          printf '%s\n' "$output"

          grep -F "[HelloCoda] Pawprint confirmed. CodaLoader can load me." <<< "$output"
          grep -F "[CodaLoader] Ready. 1 mod(s) initialized." <<< "$output"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME"             dist/CodaLoader-0.0.1-foundation.jar             dist/hello-coda-0.0.1.jar             dist/Launch-CodaLoader.bat             --title "CodaLoader $GITHUB_REF_NAME"             --generate-notes
