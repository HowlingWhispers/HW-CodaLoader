name: Publish CodaLoader tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./scripts/build-dist.sh
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             dist/CodaLoader-0.0.2-bootstrap.jar             dist/hello-coda-0.0.1.jar             dist/Launch-CodaLoader.bat             --title "CodaLoader $GITHUB_REF_NAME"             --generate-notes
