name: Publish CodaLoader tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./scripts/build-dist.sh
      - name: Publish bundle assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="$(find dist -maxdepth 1 -name 'CodaLoader-v*-win64.zip' -print -quit)"
          gh release create "$GITHUB_REF_NAME"             "$ZIP"             dist/update-manifest.json             --title "CodaLoader $GITHUB_REF_NAME"             --generate-notes
