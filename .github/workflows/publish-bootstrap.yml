name: Publish CodaLoader bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.0.22 bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./scripts/build-dist.sh

      - name: Test HW Essentials and command bridge
        run: bash scripts/test-essentials.sh

      - name: Smoke-test loader
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda.jar run/mods/
          java -jar dist/CodaLoader.jar --loader-only run

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.0.22"
          ZIP="dist/CodaLoader-v0.0.22-win64.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; bump the version for a new build." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          # CodaLoader 0.0.22

          Pinned to Minecraft Java 26.4 Snapshot 3.

          - Discord, YouTube, language and accessibility controls now sit in a separate centred row below Settings and Clock Out.
          - Small controls keep their native actions and no longer overlap the main menu buttons.
          - Layout remains stable across polling and menu rebuilds.
          - Existing Coda menus, HW Essentials, worlds, homes and settings are preserved.

          CI checks main-button/icon separation, pairwise icon overlap, centring, actions and reinitialization. Live Snapshot 3 layout still needs an in-game check.
          EOF
          gh release create "$TAG" "$ZIP" dist/update-manifest.json dist/hw-essentials.jar \
            --target "$GITHUB_SHA" --title "CodaLoader 0.0.22" \
            --notes-file release-notes.md --prerelease