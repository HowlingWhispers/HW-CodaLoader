name: Publish CodaLoader bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.0.23 bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./scripts/build-dist.sh

      - name: Test HW Essentials and command bridge
        run: bash scripts/test-essentials.sh

      - name: Set up Minecraft Java 25 runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify menu lifecycle hooks on Java 25
        run: bash scripts/test-essentials.sh

      - name: Smoke-test loader
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda.jar run/mods/
          java -jar dist/CodaLoader.jar --loader-only run

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.0.23"
          ZIP="dist/CodaLoader-v0.0.23-win64.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; bump the version for a new build." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          # CodaLoader 0.0.23

          Pinned to Minecraft Java 26.4 Snapshot 3.

          - Coda menus are applied during native screen initialization, before their first frame, rather than after a polling delay.
          - Reopening the pause menu and resizing reapply the layout immediately.
          - Pause-menu small controls have their own row. World Options remains accessible next to Settings.
          - Native actions, HW Essentials, worlds, homes and settings are preserved.

          Automated tests exercise the real Java-agent transformation on Java 21 and 25, repeated screen opening and widget rebuilds. Live Snapshot 3 still needs an in-game check.
          EOF
          gh release create "$TAG" "$ZIP" dist/update-manifest.json dist/hw-essentials.jar \
            --target "$GITHUB_SHA" --title "CodaLoader 0.0.23" \
            --notes-file release-notes.md --prerelease
