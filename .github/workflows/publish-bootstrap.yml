name: Publish CodaLoader bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.0.17 menu scenes bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./scripts/build-dist.sh

      - name: Smoke-test loader
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda.jar run/mods/
          java -jar dist/CodaLoader.jar --loader-only run

      - name: Publish or refresh prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.0.17-menu-scenes"
          ZIP="dist/CodaLoader-v0.0.17-menu-scenes-win64.zip"

          cat > release-notes.md <<'EOF'
          # CodaLoader v0.0.17 Menu Scenes

          Download **CodaLoader-v0.0.17-menu-scenes-win64.zip**, extract it into its own folder, then double-click **Launch-CodaLoader.bat**.

          The files inside the ZIP keep stable names:
          - CodaLoader.jar
          - Launch-CodaLoader.bat
          - run/mods/hello-coda.jar

          CodaLoader checks this public GitHub release on startup. In auto mode it verifies SHA-256 hashes, stages a newer or repaired bundle, replaces only the managed CodaLoader files, and restarts automatically.

          New in 0.0.17:
          - Keeps the existing grounded four-wall panorama as the classic menu scene
          - Adds an experimental Banner Sweep scene derived from menu_banner.png or the existing four panorama images
          - Randomly selects a menu scene at game startup
          - Selects a different scene when returning to Minecraft's title screen and requests a resource reload
          - Keeps generated sky/floor faces so character art never appears overhead or underfoot
          - Keeps --root and --base-pack launcher-managed behavior from 0.0.16

          User worlds, configs, custom music, branding source art, and other mods are not part of the managed update set.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            for OLD in CodaLoader-0.0.3-hook.jar hello-coda-0.0.1.jar Launch-CodaLoader.bat; do
              gh release delete-asset "$TAG" "$OLD" -y >/dev/null 2>&1 || true
            done
            gh release upload "$TAG" "$ZIP" dist/update-manifest.json --clobber
            gh release edit "$TAG" --notes-file release-notes.md --prerelease --title "CodaLoader v0.0.17 Menu Scenes"
          else
            gh release create "$TAG" "$ZIP" dist/update-manifest.json               --target "$GITHUB_SHA"               --title "CodaLoader v0.0.17 Menu Scenes"               --notes-file release-notes.md               --prerelease
          fi
