name: Publish CodaLoader bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.0.20 bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./scripts/build-dist.sh

      - name: Test HW Essentials and command bridge
        run: bash scripts/test-essentials.sh

      - name: Smoke-test loader
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda.jar run/mods/
          java -jar dist/CodaLoader.jar --loader-only run

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.0.20"
          ZIP="dist/CodaLoader-v0.0.20-win64.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; bump the version for a new build." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          # CodaLoader 0.0.20

          Pinned to Minecraft Java 26.4 Snapshot 3.

          - HW Essentials 0.2.0 adds /back for safe session return trips after /home.
          - Return points are isolated per world/player; refused teleports preserve them.
          - Mod source, storage tests and releases live in HW-Mods.
          - CodaLoader fetches HW Essentials from GitHub Releases and embeds it for automatic profile installation.
          - CML command API (CodaMod, CodaContext, CodaCommand, CodaCommandContext, CodaPosition, CodaCommands) and server-thread bridge remain in CodaLoader.
          - Homes, settings and manually changed conflicting mod files are preserved during updates.

          Download the Windows bundle for the complete loader. The standalone hw-essentials.jar requires CodaLoader 0.0.20+.

          CI covers compilation, loading, persistence, command parsing with real Brigadier and adapter fixtures. Live Snapshot 3 registration and teleportation still require an in-game playtest.
          EOF
          gh release create "$TAG" "$ZIP" dist/update-manifest.json dist/hw-essentials.jar \
            --target "$GITHUB_SHA" --title "CodaLoader 0.0.20" \
            --notes-file release-notes.md --prerelease