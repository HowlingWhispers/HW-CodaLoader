name: Publish CodaLoader bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.0.21 bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./scripts/build-dist.sh

      - name: Test HW Essentials and command bridge
        run: bash scripts/test-essentials.sh

      - name: Smoke-test loader
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda.jar run/mods/
          java -jar dist/CodaLoader.jar --loader-only run

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.0.21"
          ZIP="dist/CodaLoader-v0.0.21-win64.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; bump the version for a new build." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          # CodaLoader 0.0.21

          Pinned to Minecraft Java 26.4 Snapshot 3.

          - Main menu focuses on personal worlds: My Worlds, Coda's Settings and Clock Out.
          - Realms and traditional Multiplayer controls are removed.
          - Pause menu offers Back to Adventure, Pawprints, Coda's Ledger, Coda's Settings and Save & Curl Up.
          - Open to LAN and vanilla feedback/report-bug shortcuts are removed from the pause menu.
          - Buttons reuse native world, settings, progress, resume and save handlers.
          - Coda's wording extends to world selection, resource packs and settings through the UI language pack.
          - HW Essentials 0.2.0 remains bundled automatically; homes and settings are preserved.

          CI checks GUI adapter fixtures and the command bridge. Actual Snapshot 3 menu layout, keyboard navigation and gameplay still require an in-game playtest.
          EOF
          gh release create "$TAG" "$ZIP" dist/update-manifest.json dist/hw-essentials.jar \
            --target "$GITHUB_SHA" --title "CodaLoader 0.0.21" \
            --notes-file release-notes.md --prerelease