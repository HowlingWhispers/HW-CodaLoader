name: Publish CodaLoader bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.0.18 HW Essentials bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./scripts/build-dist.sh

      - name: Test HW Essentials and command bridge
        run: bash scripts/test-essentials.sh

      - name: Smoke-test loader
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda.jar run/mods/
          java -jar dist/CodaLoader.jar --loader-only run

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.0.18-essentials"
          ZIP="dist/CodaLoader-v0.0.18-essentials-win64.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; bump the version for a new build." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          # CodaLoader 0.0.18 + HW Essentials 0.1.0

          Pinned to Minecraft Java 26.4 Snapshot 3.

          - CML-native HW Essentials mod with /sethome, /home, /homes, /delhome and /hwessentials.
          - Separate named homes per player and world; facing saved; ten configurable slots.
          - Same-dimension singleplayer travel with server-thread landing checks.
          - Small Coda command API and integrated-server bridge; command trees refreshed for connected players.
          - Official mod JAR embedded in CodaLoader and installed automatically into the active profile.
          - Homes, settings and manually changed conflicting mod files are preserved.

          Download the Windows bundle for the complete loader, or hw-essentials.jar for the standalone mod (requires CodaLoader 0.0.18).

          CI covers compilation, loading, persistence, command parsing with real Brigadier and adapter fixtures. Live Snapshot 3 registration and teleportation still require an in-game playtest.
          EOF
          gh release create "$TAG" "$ZIP" dist/update-manifest.json dist/hw-essentials.jar \
            --target "$GITHUB_SHA" --title "CodaLoader 0.0.18 + HW Essentials 0.1.0" \
            --notes-file release-notes.md --prerelease
