name: Publish CodaLoader bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.0.24 bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./scripts/build-dist.sh

      - name: Test HW Essentials and command bridge
        run: bash scripts/test-essentials.sh

      - name: Set up Minecraft Java 25 runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify menu lifecycle hooks on Java 25
        env:
          MENU_FIXTURE_RELEASE: "25"
        run: bash scripts/test-essentials.sh

      - name: Smoke-test loader
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda.jar run/mods/
          java -jar dist/CodaLoader.jar --loader-only run

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.0.24"
          ZIP="dist/CodaLoader-v0.0.24-win64.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; bump the version for a new build." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          # CodaLoader 0.0.24

          Pinned to Minecraft Java 26.4 Snapshot 3.

          - Discord, Snapshot 3's three native controls and YouTube are spaced together in one centered row.
          - Social-button injection immediately reflows the complete row with eight-pixel gaps.
          - Returning from Settings, world selection or other title submenus no longer rotates the scene, reloads resources or restarts the music.
          - Scene rotation happens only after leaving an actual world.
          - Native actions, menu initialization hooks, HW Essentials, worlds, homes and settings are preserved.

          CI checks five-control spacing and handlers, submenu/world transitions and the real Java-agent lifecycle on Java 21 and 25. Live Snapshot 3 still needs an in-game check.
          EOF
          gh release create "$TAG" "$ZIP" dist/update-manifest.json dist/hw-essentials.jar \
            --target "$GITHUB_SHA" --title "CodaLoader 0.0.24" \
            --notes-file release-notes.md --prerelease
