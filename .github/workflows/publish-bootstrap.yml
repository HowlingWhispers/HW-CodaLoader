name: Publish bootstrap prerelease

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.0.2 bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./scripts/build-dist.sh

      - name: Smoke-test loader
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda-0.0.1.jar run/mods/
          java -jar dist/CodaLoader-0.0.2-bootstrap.jar --loader-only run

      - name: Publish or refresh prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.0.2-bootstrap"
          cat > release-notes.md <<'EOF'
          # CodaLoader v0.0.2 Bootstrap

          First CodaLoader build intended to start Minecraft itself.

          - Resolves Minecraft Java 26.4 Snapshot 3 from Mojang's official version manifest
          - Reuses files from the official .minecraft installation when possible
          - Downloads missing client, libraries, natives and assets from Mojang/CDN sources
          - Verifies published SHA-1 hashes and sizes when metadata provides them
          - Creates an isolated run/game directory
          - Starts vanilla Minecraft through CodaLoader
          - Uses an offline CodaPlayer identity for this first bootstrap test

          This prerelease proves vanilla bootstrapping. Coda mod injection into Minecraft comes next.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               dist/CodaLoader-0.0.2-bootstrap.jar               dist/hello-coda-0.0.1.jar               dist/Launch-CodaLoader.bat               --clobber
            gh release edit "$TAG" --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG"               dist/CodaLoader-0.0.2-bootstrap.jar               dist/hello-coda-0.0.1.jar               dist/Launch-CodaLoader.bat               --target "$GITHUB_SHA"               --title "CodaLoader v0.0.2 Bootstrap"               --notes-file release-notes.md               --prerelease
          fi
