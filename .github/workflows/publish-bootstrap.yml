name: Publish CodaLoader bundle

# Main branch builds are development artifacts only. A release must be
# explicitly authorized after the launcher/account handoff has been live-tested.
on:
  workflow_dispatch:
    inputs:
      verified_launcher_and_identity:
        description: "I have live-tested account verification and this loader with the published launcher"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish versioned CodaLoader bundle
    runs-on: ubuntu-latest

    steps:
      - name: Confirm release readiness
        env:
          VERIFIED: ${{ inputs.verified_launcher_and_identity }}
        run: |
          if [[ "$VERIFIED" != "true" ]]; then
            echo "::error::Release blocked: the verified launcher and Minecraft identity handoff have not been confirmed."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./scripts/build-dist.sh

      - name: Test HW Essentials and command bridge
        run: bash scripts/test-essentials.sh

      - name: Set up Minecraft Java 25 runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify menu lifecycle hooks on Java 25
        env:
          MENU_FIXTURE_RELEASE: "25"
        run: bash scripts/test-essentials.sh

      - name: Smoke-test loader
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda.jar run/mods/
          java -jar dist/CodaLoader.jar --loader-only run

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(java -jar dist/CodaLoader.jar --version)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid packaged CodaLoader version: $VERSION" >&2
            exit 1
          }
          TAG="v${VERSION}"
          ZIP="dist/CodaLoader-v${VERSION}-win64.zip"
          test -f "$ZIP"
          test -f dist/update-manifest.json
          grep -F "\"version\": \"${VERSION}\"" dist/update-manifest.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump CodaTarget.LOADER_VERSION; never silently replace an existing binary."
            exit 1
          fi
          cat > release-notes.md <<EOF
          # CodaLoader ${VERSION}

          Minecraft Java 26.4 Snapshot 3 prerelease.

          - CML-owned layouts for the title and Escape menus, with retained native game actions.
          - Consistent Coda-flavoured labels, tooltips and icon spacing.
          - GUI-thread lifecycle, menu rebuild and duplicate injection protection.
          - Safe fallback to the legacy menu layout on incompatible screens.
          - HW Essentials and existing worlds remain supported.

          Tested by CI with command, menu and Java-agent fixtures on Java 21 and 25.
          **Live Snapshot 3 menu verification is still required.**
          EOF
          gh release create "$TAG" "$ZIP" dist/update-manifest.json dist/hw-essentials.jar \
            --target "$GITHUB_SHA" --title "CodaLoader ${VERSION}" \
            --notes-file release-notes.md --prerelease
