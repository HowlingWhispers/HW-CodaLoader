name: Publish HOWL bundle and SDK

# Only a deliberate loader version bump can produce a new prerelease.
# Publishing requires the compatible 0.7.1+ CodaLauncher release and full
# Java 21/25 fixture tests. Source-only changes never overwrite a release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish versioned CodaLoader bundle
    runs-on: ubuntu-latest

    steps:
      - name: Require compatible published CodaLauncher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.7.1 --repo HowlingWhispers/HW-CodaLauncher >/dev/null 2>&1; then
            echo "::error::CodaLauncher 0.7.1 must be published before this loader can be released."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build distribution
        run: ./scripts/build-dist.sh

      - name: Test HW Essentials and command bridge
        run: bash scripts/test-essentials.sh

      - name: Set up Minecraft Java 25 runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify menu lifecycle hooks on Java 25
        env:
          MENU_FIXTURE_RELEASE: "25"
        run: bash scripts/test-essentials.sh

      - name: Assert tested Coda Companion embedded (Stable and Nightly)
        run: |
          set -euo pipefail
          jar tf dist/CodaLoader.jar | grep -Fx 'codaloader/mods/coda-wolf-0.1.0-dev.jar'
          unzip -p "dist/CodaLoader-v$(java -jar dist/CodaLoader.jar --version)-win64.zip" bundled-mods/coda-wolf-0.1.0-dev.jar |
            sha256sum | grep -F '18d13b3e6bb22f8d21a0911ae112d655cea735f19f2d166b8075bee379ff027a'
          unzip -p dist/CodaLoader.jar codaloader/mods/coda-wolf-0.1.0-dev.jar |
            sha256sum | grep -F '18d13b3e6bb22f8d21a0911ae112d655cea735f19f2d166b8075bee379ff027a'

      - name: Smoke-test loader
        run: |
          rm -rf run
          mkdir -p run/mods
          cp dist/hello-coda.jar run/mods/
          java -jar dist/CodaLoader.jar --loader-only run
          test -f run/mods/coda-wolf-0.1.0-dev.jar
          test -f run/config/codaloader-managed/coda-wolf-0.1.0-dev.jar.sha256

      - name: Verify HOWL SDK starter
        run: |
          version="$(java -jar dist/CodaLoader.jar --version)"
          unzip -q "dist/HOWL-SDK-v${version}.zip" -d out/sdk-check
          bash out/sdk-check/build-mod.sh
          mkdir -p out/sdk-run/mods
          cp out/sdk-check/out/hello-coda.jar out/sdk-run/mods/
          java -jar dist/CodaLoader.jar --loader-only out/sdk-run | grep -F 'Pawprint confirmed'

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(java -jar dist/CodaLoader.jar --version)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid packaged CodaLoader version: $VERSION" >&2
            exit 1
          }
          TAG="v${VERSION}"
          ZIP="dist/CodaLoader-v${VERSION}-win64.zip"
          test -f "$ZIP"
          test -f dist/update-manifest.json
          grep -F "\"version\": \"${VERSION}\"" dist/update-manifest.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Published $TAG is immutable. Source-only changes won't replace it; bump the version for a new release."
            exit 0
          fi
          cat > release-notes.md <<EOF
          # H.O.W.L. ${VERSION} — Howling Open Works Loader

          Minecraft Java 26.4 Snapshot 3 prerelease.

          - Coda Companion is now a REQUIRED bundled H.O.W.L. mod.
          - Ship the tested 0.1.2-dev wolf and exclusive icy-white fur in
            BOTH Stable and Nightly without a separate mod download.
          - Verify packaged mod SHA-256 against its known-good release.
          - Keep environmental awareness, BuildCraft and other experimental
            addons separate from the bundled stable companion.

          - Fix Coda Companion's magenta-and-black missing texture.
          - Translate the legacy Coda wolf sprite ID into the direct PNG
            resource location required by WolfRenderState.texture.
          - Verify BOTH normal/angry identifiers resolve to real files
            inside the generated exclusive resource pack.
          - Keep Coda Wolf 0.1.2 compatible; no mod reinstall required.
          - Vanilla wolves, saves, Stable, and BuildCraft remain untouched.

          Verified by headless Java tests and exact Minecraft Snapshot 3
          renderer tests. Player visual confirmation remains the final gate.
          EOF
          gh release create "$TAG" "$ZIP" dist/update-manifest.json dist/hw-essentials.jar "dist/HOWL-SDK-v${VERSION}.zip" "dist/howl-api-${VERSION}.jar" \
            --target "$GITHUB_SHA" --title "H.O.W.L. ${VERSION}" \
            --notes-file release-notes.md --prerelease
