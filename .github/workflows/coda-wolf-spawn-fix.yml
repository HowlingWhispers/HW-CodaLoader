name: Verify Coda Wolf spawn diagnostics
on:
  push:
    branches: [fix/coda-wolf-spawn-diagnostics, fix/coda-wolf-snapshot3-native-lookup, fix/coda-wolf-snapshot3-taming]
    paths:
      - 'examples/coda-wolf/**'
      - '.github/workflows/coda-wolf-spawn-fix.yml'
  pull_request:
    paths:
      - 'examples/coda-wolf/**'
      - '.github/workflows/coda-wolf-spawn-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Survival and persistence tests
        run: bash examples/coda-wolf/scripts/test.sh
      - name: Compile isolated mod against current public H.O.W.L. API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/howlapi
          find src/main/java/dev/howlingwhispers/codaloader/api -name '*.java' > build/api-sources.txt
          javac --release 21 -d build/howlapi @build/api-sources.txt
          jar --create --file build/howl-api.jar -C build/howlapi .
          bash examples/coda-wolf/scripts/build.sh "$PWD/build/howl-api.jar"
      - name: Test direct summon command without Minecraft hook
        run: |
          javac --release 21 -encoding UTF-8 -cp "build/howlapi:examples/coda-wolf/out/classes" \
            -d examples/coda-wolf/out/classes examples/coda-wolf/tests/CodaWolfCommandTest.java
          java -cp "build/howlapi:examples/coda-wolf/out/classes" CodaWolfCommandTest
      - name: Reproduce missing Snapshot 3 wolf constant, day clock and ownership method
        run: |
          set -euo pipefail
          mkdir -p examples/coda-wolf/out/native-fixture
          find examples/coda-wolf/tests/native-fixture/src -name '*.java' > examples/coda-wolf/out/native-fixture-sources.txt
          javac --release 21 -encoding UTF-8 -d examples/coda-wolf/out/native-fixture \
            @examples/coda-wolf/out/native-fixture-sources.txt \
            examples/coda-wolf/src/dev/howlingwhispers/codawolf/NativeCalls.java \
            examples/coda-wolf/src/dev/howlingwhispers/codawolf/MinecraftWolfBridge.java
          java -cp examples/coda-wolf/out/native-fixture dev.howlingwhispers.codawolf.NativeLookupSnapshotTest
      - name: Verify official launcher-readable mod JAR
        run: |
          python3 - <<'PY'
          import json,zipfile
          f='examples/coda-wolf/out/coda-wolf-0.1.0-dev.jar'
          with zipfile.ZipFile(f) as z:
              m=json.loads(z.read('coda.mod.json'))
              assert m['schema']==1 and m['id']=='coda_wolf'
              assert m['version']=='0.1.1-dev'
              assert m['minecraft']=='26.4-snapshot-3'
              assert m['entrypoint'].replace('.','/')+'.class' in z.namelist()
              assert 'dev/howlingwhispers/codawolf/MinecraftWolfBridge.class' in z.namelist()
          print('PASS: developer JAR metadata and implementation available')
          PY
